<script type="module">
import { start, releases, t } from './site.js?v=7';
// 버전별 바뀐 점: 고른 언어로(없으면 영어, 그다음 한국어)
const draw = async () => {
  const r = await releases;
  if (!r) return;
  const lang = document.documentElement.lang;
  document.getElementById('rel').innerHTML = r.releases.map((x) => `<li class="clay${x.version === r.latest ? ' latest' : ''}">
    <div class="rv"><b>v${x.version}</b><time>${x.date}</time>${x.version === r.latest ? `<span>${t('up_latest')}</span>` : ''}</div>
    <ul>${(x.notes[lang] || x.notes.en || x.notes.ko).map((n) => `<li>${n}</li>`).join('')}</ul></li>`).join('');
};
document.addEventListener('lang', draw);
start();
</script>
